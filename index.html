<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Результат сканирования</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="title-wrap">
      <span class="ok">✓</span>
      <h1 id="title">Сканирование завершено</h1>
    </div>
    <div class="top-actions">
      <div class="lang-switch">
        <button type="button" class="lang-btn active" data-lang="ru">РУС</button>
        <button type="button" class="lang-btn" data-lang="en">АНГЛ</button>
      </div>
      <a class="btn" id="home-link" href="home.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20a8 8 0 0 0-14-5L4 10"/></svg>
        <span id="home-label">На главную</span>
      </a>
    </div>
  </header>

  <main class="result-main">
    <section class="result-left">
      <div class="viewbar">
        <span class="viewbar-label" id="view-label">Вид результата</span>
        <div class="seg">
          <button type="button" class="active" data-mode="normal" id="mode-normal">Обычный</button>
          <button type="button" data-mode="bands" id="mode-bands">3 диапазона</button>
          <button type="button" data-mode="turbo" id="mode-turbo">ТУРБО</button>
        </div>
      </div>
      <div class="preview">
        <img id="result-image" src="result_g3_normal.png" alt="Результат сканирования" />
      </div>
      <div class="actions">
        <button type="button" class="btn" id="save-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
          <span id="save-label">Скачать изображение</span>
        </button>
        <a class="btn btn-primary" id="rec-link" href="recommendation.html">
          <span id="rec-label">Рекомендация</span>
        </a>
      </div>
    </section>

    <aside class="result-right">
      <div class="flatfoot">
        <img src="flatfoot-strip.webp" alt="Справка по плоскостопию" />
      </div>
      <div class="info">
        <div class="info-title" id="info-title">Информация</div>
        <div class="info-sub" id="info-sub">Рекомендация размера</div>
        <div class="info-row">
          <span class="info-key" id="shoe-key">Размер обуви</span>
          <span class="info-value">38 RU</span>
        </div>
        <div class="info-line" id="feet-line">Левый: 242.2 мм · Правый: 237.9 мм</div>
        <div class="info-line" id="snapshot-line">Снимок 1237 × 1400 · 7.8 с</div>
      </div>
    </aside>
  </main>
</div>

<script>
  const UI = {
    ru: {
      title: "Сканирование завершено",
      home: "На главную",
      view: "Вид результата",
      normal: "Обычный",
      bands: "3 диапазона",
      turbo: "ТУРБО",
      save: "Скачать изображение",
      rec: "Рекомендация",
      info: "Информация",
      infoSub: "Рекомендация размера",
      shoe: "Размер обуви",
      feet: "Левый: 242.2 мм · Правый: 237.9 мм",
      snapshot: "Снимок 1237 × 1400 · 7.8 с",
      alt: "Результат сканирования",
      flatfootAlt: "Справка по плоскостопию",
      langRu: "РУС",
      langEn: "АНГЛ"
    },
    en: {
      title: "Scan complete",
      home: "Back to home",
      view: "Result view",
      normal: "Normal",
      bands: "3-band",
      turbo: "TURBO",
      save: "Save image",
      rec: "Recommendation",
      info: "Information",
      infoSub: "Size recommendation",
      shoe: "Shoe size",
      feet: "Left: 242.2 mm · Right: 237.9 mm",
      snapshot: "Snapshot 1237 × 1400 · 7.8 s",
      alt: "Scan result",
      flatfootAlt: "Flatfoot reference",
      langRu: "RU",
      langEn: "EN"
    }
  };
  const MODES = {
    normal: "result_g3_normal.png",
    bands: "result_g3_3band.png",
    turbo: "result_g3_turbo.png"
  };
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") === "en" ? "en" : "ru";
  let mode = "normal";

  function applyLang() {
    const t = UI[lang];
    document.documentElement.lang = lang;
    document.getElementById("title").textContent = t.title;
    document.getElementById("home-label").textContent = t.home;
    document.getElementById("view-label").textContent = t.view;
    document.getElementById("mode-normal").textContent = t.normal;
    document.getElementById("mode-bands").textContent = t.bands;
    document.getElementById("mode-turbo").textContent = t.turbo;
    document.getElementById("save-label").textContent = t.save;
    document.getElementById("rec-label").textContent = t.rec;
    document.getElementById("info-title").textContent = t.info;
    document.getElementById("info-sub").textContent = t.infoSub;
    document.getElementById("shoe-key").textContent = t.shoe;
    document.getElementById("feet-line").textContent = t.feet;
    document.getElementById("snapshot-line").textContent = t.snapshot;
    document.getElementById("result-image").alt = t.alt;
    document.querySelector(".flatfoot img").alt = t.flatfootAlt;
    document.getElementById("home-link").href = "home.html?lang=" + lang;
    document.getElementById("rec-link").href = "recommendation.html?lang=" + lang;
    document.querySelectorAll(".lang-btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.textContent = b.dataset.lang === "ru" ? t.langRu : t.langEn;
    });
  }

  function applyMode(next) {
    mode = next;
    document.getElementById("result-image").src = MODES[mode];
    document.querySelectorAll(".seg button").forEach((b) => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });
  }

  document.querySelectorAll(".lang-btn").forEach((b) => {
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      applyLang();
    });
  });
  document.querySelectorAll(".seg button").forEach((b) => {
    b.addEventListener("click", () => applyMode(b.dataset.mode));
  });
  document.getElementById("save-btn").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = MODES[mode];
    a.download = "scan-result.png";
    a.click();
  });

  applyLang();
  applyMode("normal");
</script>
</body>
</html>
